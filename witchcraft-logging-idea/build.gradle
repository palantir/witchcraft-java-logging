apply plugin: 'com.palantir.external-publish-intellij'

dependencies {
    implementation project(':witchcraft-logging-formatting'), {
        exclude group: 'org.slf4j'
        because 'Must use intellij slf4j to produce logging'
    }
    implementation 'com.palantir.witchcraft.api:witchcraft-logging-api-objects', {
        exclude group: 'org.slf4j'
        because 'Must use intellij slf4j to produce logging'
    }
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'

    annotationProcessor 'org.immutables:value'
    compileOnly 'org.immutables:value-annotations'

    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core'
}

def minimumIntellijBuild = '232.10203.10' // 2023.2.4

repositories {
    intellijPlatform {
        defaultRepositories()
    }
}

intellijPlatform {
    pluginConfiguration {
        name = 'witchcraft-logging-idea'
        ideaVersion {
            sinceBuild = minimumIntellijBuild
        }
    }

    pluginVerification {
        ides {
            ide('IC', '2024.1')
            ide('IU', '2024.2.1')
            ide('GO', '2024.2')
        }
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity(minimumIntellijBuild) {
            useInstaller = false
        }
    }
}

check.dependsOn verifyPlugin
